name: Stream Vercel Site to YouTube

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Fast Install Dependencies
        run: |
          # 1. Fast mirror (Fixes slow download)
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          
          # 2. Install tools + ALSA audio bridge
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils xvfb xdotool libasound2-plugins

      - name: Setup & Stream 720p 30FPS Smooth
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          TARGET_URL: "https://test-site-gray-sigma.vercel.app/"
        run: |
          # 1. Start Virtual Display in 720p
          echo "Starting 720p Virtual Display..."
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2

          # 2. Setup Virtual Audio Sink
          echo "Setting up PulseAudio..."
          pulseaudio --start --exit-idle-time=-1
          sleep 2
          pactl load-module module-null-sink sink_name=VirtualSink sink_properties=device.description=VirtualSink
          pactl set-default-sink VirtualSink
          export PULSE_SINK=VirtualSink

          # 3. Suppress Chrome First Run prompts
          mkdir -p ~/.config/google-chrome
          touch ~/.config/google-chrome/'First Run'

          # 4. Launch Chrome
          echo "Launching Google Chrome..."
          google-chrome \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-search-engine-choice-screen \
            --test-type \
            --disable-dev-shm-usage \
            --autoplay-policy=no-user-gesture-required \
            --disable-infobars \
            --disable-gpu \
            --disable-background-timer-throttling \
            --window-size=1280,720 \
            --window-position=0,0 \
            --start-fullscreen \
            --kiosk "$TARGET_URL" &

          # 5. Wait for YouTube API and trigger clicks in a loop (Guaranteed Audio Start)
          echo "Waiting 10 seconds for YouTube IFrame to initialize..."
          sleep 10

          echo "Triggering clicks until audio starts..."
          for i in {1..6}; do
            echo "Click attempt $i..."
            xdotool search --onlyvisible --class "google-chrome" windowfocus || true
            xdotool mousemove 640 360 click 1 || true
            xdotool key Return || true
            xdotool key space || true
            sleep 2
          done

          # 6. Stream with Strict Constant 30 FPS
          echo "Streaming 720p @ 30 FPS to YouTube Live..."
          ffmpeg -hide_banner -loglevel warning \
            -thread_queue_size 512 -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i :99.0 \
            -thread_queue_size 512 -f pulse -i VirtualSink.monitor \
            -c:v libx264 -preset ultrafast -tune zerolatency \
            -fps_mode cfr -r 30 -g 60 -keyint_min 60 -sc_threshold 0 \
            -b:v 1800k -maxrate 1800k -bufsize 3600k -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
